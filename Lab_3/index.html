<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Model Toy Cars Lab_3</title>

    <!-- Link to CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Header Section -->
<header>

    <h1>Model Toy Cars Showcase</h1>

    <p>JavaScript Object Constructor Lab</p>

    <p><strong>Student:</strong> Hiyaben Hareshbhai Jayswal</p>

</header>


<!-- Container where toy cars will be displayed -->
<div class="container" id="carContainer"></div>


<!-- Interaction Section -->
<div class="interaction">

    <h2>Modify Toy Car Color</h2>

    <!-- Select which toy car to change -->
    <label>Select Car:</label>

    <select id="carSelect">
        <option value="0">Ferrari 488 GTB</option>
        <option value="1">Lamborghini Aventador</option>
        <option value="2">Ford Mustang GT</option>
    </select>

    <!-- Input new color -->
    <input type="text" id="colorInput" placeholder="Enter new color">

    <!-- Button calls JavaScript function -->
    <button onclick="changeColor()">Change Color</button>

</div>


<!-- Link JavaScript -->
<script src="script.js"></script>

</body>
</html>
