<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Bowl Builder</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Energy Bowl Builder</h1>
        <p>Build your perfect healthy energy bowl!</p>
    </header>

    <main>
        <!-- Form Section -->
        <form id="bowlForm">
            <!-- Bowl Base -->
            <section class="form-section">
                <h2>Bowl Base</h2>
                <select id="base" required>
                    <option value="" disabled selected>Select Base</option>
                    <option value="acai">Acai</option>
                    <option value="yogurt">Yogurt</option>
                    <option value="oatmeal">Oatmeal</option>
                    <option value="chia">Chia Pudding</option>
                </select>
            </section>

            <!-- Size Selection -->
            <section class="form-section">
                <h2>Size</h2>
                <label><input type="radio" name="size" value="small"> Small (+ $0)</label>
                <label><input type="radio" name="size" value="medium"> Medium (+ $2)</label>
                <label><input type="radio" name="size" value="large"> Large (+ $4)</label>
            </section>

            <!-- Fruits -->
            <section class="form-section">
                <h2>Fruits</h2>
                <label><input type="checkbox" name="fruits" value="banana"> Banana</label>
                <label><input type="checkbox" name="fruits" value="strawberry"> Strawberry</label>
                <label><input type="checkbox" name="fruits" value="blueberry"> Blueberry</label>
                <label><input type="checkbox" name="fruits" value="mango"> Mango</label>
                <label><input type="checkbox" name="fruits" value="kiwi"> Kiwi</label>
            </section>

            <!-- Toppings -->
            <section class="form-section">
                <h2>Toppings</h2>
                <label><input type="checkbox" name="toppings" value="granola"> Granola</label>
                <label><input type="checkbox" name="toppings" value="coconut"> Coconut Flakes</label>
                <label><input type="checkbox" name="toppings" value="almonds"> Almonds</label>
                <label><input type="checkbox" name="toppings" value="chia_seeds"> Chia Seeds</label>
                <label><input type="checkbox" name="toppings" value="pumpkin_seeds"> Pumpkin Seeds</label>
                <label><input type="checkbox" name="toppings" value="chocolate_chips"> Chocolate Chips</label>
            </section>
            
            <!-- Proteins -->
            <section class="form-section">
                <h2>Protein Add-ons</h2>
                <label><input type="checkbox" name="proteins" value="whey"> Whey</label>
                <label><input type="checkbox" name="proteins" value="pea"> Pea Protein</label>
                <label><input type="checkbox" name="proteins" value="greek_yogurt"> Greek Yogurt</label>
            </section>

            <button type="submit" class="submit-btn">Place Order</button>
        </form>

        <!-- Output Section -->
        <section id="output">
            <h2>Your Bowl</h2>
            <div id="bowlDescription"></div>
            <div id="bowlImages"></div>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
